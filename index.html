<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Solo se ejecuta código de la app y del SDK de Supabase: aunque un texto
       malicioso llegara a la página, el navegador no lo correría. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Simplifika</title>
  <meta name="description" content="Tus cuentas, más simples. Presupuesto, deudas y gastos del mes, sin anotar todo a mano.">
  <meta name="theme-color" content="#A8B9A0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2C3828" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Simplifika">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="cargando">
  <!-- Pantalla de carga: el logo (icons/icon.svg) dibujado por partes para animarlo (js/carga.js). -->
  <div id="carga" class="carga" role="status" aria-label="Cargando Simplifika">
    <svg class="logo-carga" viewBox="70 50 400 410" aria-hidden="true">
      <g class="globo">
        <rect x="96" y="104" width="320" height="272" rx="72"/>
        <path d="M156 340 Q152 408 118 440 Q194 426 238 368 Z"/>
        <g class="puntos"><circle cx="196" cy="240" r="22"/><circle cx="256" cy="240" r="22"/><circle cx="316" cy="240" r="22"/></g>
        <g class="letra-k"><path pathLength="1" d="M210 157 V319"/><path pathLength="1" d="M216 279 L288 223"/><path pathLength="1" d="M240 261 L302 319"/></g>
      </g>
      <g class="moneda-carga">
        <circle cx="390" cy="130" r="48"/>
        <circle class="anillo" cx="390" cy="130" r="33"/>
        <path class="brillo" d="M360 120 A32 32 0 0 1 380 100"/>
      </g>
    </svg>
    <p class="marca-carga">simplifika</p>
  </div>
  <header class="barra-superior">
    <a class="logo" href="#/inicio" aria-label="Ir al inicio">
      <img class="logo-marca" src="icons/icon.svg" alt="" width="32" height="32">
    </a>
    <h1 id="titulo">Simplifika</h1>
    <button id="boton-ojo" class="boton-ojo" type="button" aria-pressed="false" aria-label="Ocultar montos" title="Ocultar montos">
      <svg class="ojo-abierto" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="ojo-cerrado" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5c2 2.6 5 4.5 9 4.5s7-1.9 9-4.5M6.2 12.6 4.5 15M12 14v3M17.8 12.6l1.7 2.4"/></svg>
    </button>
    <a class="boton-mas" href="#/mas" data-ruta="mas" aria-label="Más opciones">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M5 16h14"/></svg>
    </a>
  </header>

  <main id="vista" tabindex="-1"><p class="cargando-texto">Cargando…</p></main>

  <nav class="nav-inferior" aria-label="Secciones">
    <a href="#/inicio" data-ruta="inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5v-6H9v6H4z"/></svg><span>Inicio</span>
    </a>
    <a href="#/movimientos" data-ruta="movimientos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg><span>Gastos</span>
    </a>
    <a href="#/presupuesto" data-ruta="presupuesto">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l5.5 5.5"/></svg><span>Presupuesto</span>
    </a>
    <a href="#/deudas" data-ruta="deudas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/></svg><span>Plan</span>
    </a>
  </nav>
  <!-- La acción principal va fuera de la barra: la barra es solo para moverse entre secciones. -->
  <button id="boton-agregar" class="boton-agregar" aria-label="Agregar gasto">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span aria-hidden="true">Gasto</span>
  </button>

  <dialog id="dialogo"><form method="dialog" id="dialogo-form"></form></dialog>
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
