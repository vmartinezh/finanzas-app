<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas · Simplifika</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 24px; background: #fcfcfb; color: #0b0b0b; }
    .ok { color: #0a7f0a; } .falla { color: #c13030; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #1a1a19; color: #f0efec; } .ok { color: #3cb83c; } .falla { color: #ec6b6b; } }
  </style>
</head>
<body>
  <h1>Pruebas</h1>
  <p id="resumen">Corriendo…</p>
  <ol id="resultados"></ol>
  <script type="module">
    // Abre esta página con la app servida (ver README) para correr las pruebas.
    // No toca tus datos: trabaja sobre datos en memoria.
    import { datos } from '../js/db.js';
    import { clasificar } from '../js/clasificador.js';
    import { planDeudas, disponibleDelMes, estadoPresupuesto, destinoDeudas, usoCupo, cuotasDeCobro, estadoCobro, resumenMeDeben, cobrosDeHoy, cobrosParaTransferencia, personaDeTransferencia, dividirGasto } from '../js/calculos.js';
    import { leerMonto, sumarMeses, sumarMesesFecha, mesActual, esc, base64urlABytes, clp, clpCorto, clpVisible, conMontosVisibles, MONTO_OCULTO, ocultarMontos, formatearMontoEscrito } from '../js/util.js';
    import { normalizarFila, normalizarTabla, normalizarPerfil, prepararRespaldo, datosDeRegistro, perfilDesdeRegistro, linkDeAtajo } from '../js/validar.js';
    import { BENEFICIOS, TARJETAS, RUBROS, beneficiosDelDia, diaSemana, textoDias, separarTarjeta, armarTarjeta, agregarTarjeta, reemplazarTarjeta, sugerirTarjeta } from '../js/beneficios.js';
    import { leerCorreoDeCompra, esDeBanco, montoEscrito, leerPagoWallet } from '../supabase/functions/recibir-compra/lectores.js';
    import { normalizarRut, esMismoNombre } from '../supabase/functions/recibir-compra/cuentas.js';
    import { TIPOS } from '../js/tarjetas.js';
    import { BENEFICIOS_CUMPLE, TIPOS_CUMPLE, CUANDO_CUMPLE, cumpleQueViene, rutaDelCumple, avisoCumple, rutaDelAnio, filtrarRegalos } from '../js/cumpleanos.js';

    // Si dejaste el ojo cerrado en la app, las pruebas igual parten con los montos a la vista.
    ocultarMontos(false, false);

    const resultados = [];
    const prueba = (nombre, fn) => {
      try { fn(); resultados.push([nombre, null]); }
      catch (e) { resultados.push([nombre, e.message]); }
    };
    const igual = (real, esperado, msg = '') => {
      if (JSON.stringify(real) !== JSON.stringify(esperado)) throw new Error(`${msg} esperaba ${JSON.stringify(esperado)}, llegó ${JSON.stringify(real)}`);
    };

    const cat = (id, nombre, extra = {}) => ({ id, nombre, icono: '', tipo: 'gasto', ...extra });
    datos.categorias = [cat('super', 'Supermercado'), cat('comida', 'Comida fuera'), cat('trans', 'Transporte'), cat('regalos', 'Regalos'), cat('mascota', 'Mascota', { palabras: 'veterinaria, pet' }), cat('sueldo', 'Sueldo', { tipo: 'ingreso' })];
    datos.eventos = [{ id: 'matri', nombre: 'Matrimonio', palabras: 'matri, boda', activo: true }, { id: 'viejo', nombre: 'Mudanza', activo: false }];
    datos.reglas = [{ id: 'r1', patron: 'mercadopago*tienda', categoria_id: 'regalos' }];

    prueba('Comercio conocido por palabra clave', () => igual(clasificar({ comercio: 'LIDER EXPRESS' }).categoria_id, 'super'));
    prueba('La palabra más larga gana: "uber eats" es comida, no transporte', () => igual(clasificar({ comercio: 'UBER EATS' }).categoria_id, 'comida'));
    prueba('Uber solo es transporte', () => igual(clasificar({ comercio: 'UBER' }).categoria_id, 'trans'));
    prueba('Lo que escribes manda sobre el comercio', () => igual(clasificar({ comercio: 'UBER', descripcion: 'regalo para la suegra' }).categoria_id, 'regalos'));
    prueba('Detecta el evento por palabra clave ("matri")', () => igual(clasificar({ comercio: 'UBER', descripcion: 'uber al aeropuerto para lo del matri' }).evento_id, 'matri'));
    prueba('No asocia eventos cerrados', () => igual(clasificar({ descripcion: 'cajas para la mudanza' }).evento_id, null));
    prueba('Usa las reglas aprendidas', () => igual(clasificar({ comercio: 'MercadoPago*Tienda' }).categoria_id, 'regalos'));
    prueba('Palabras clave propias de una categoría', () => igual(clasificar({ descripcion: 'vacuna en la veterinaria' }).categoria_id, 'mascota'));
    prueba('Palabras cortas no calzan dentro de otras ("tag" en "etiqueta")', () => igual(clasificar({ descripcion: 'etagere' }).categoria_id, null));
    prueba('Acentos y mayúsculas no importan', () => igual(clasificar({ descripcion: 'ALMACÉN de la esquina' }).categoria_id, 'super'));
    prueba('Nunca clasifica un gasto como ingreso', () => igual(clasificar({ descripcion: 'sueldo' }).categoria_id, null));

    prueba('Deuda sin interés: 1.000 con cuota 100 = 10 meses', () => {
      const p = planDeudas([{ id: 'a', nombre: 'A', saldo: 1000, cuota_mensual: 100, cae: 0 }]);
      igual(p.meses, 10); igual(Math.round(p.interesTotal), 0);
    });
    prueba('El abono extra acorta el plazo', () => {
      const d = [{ id: 'a', nombre: 'A', saldo: 1000, cuota_mensual: 100, cae: 0 }];
      igual(planDeudas(d, 200).meses, 5, 'con 200 al mes en total;');
    });
    prueba('Avalancha termina primero la de CAE más alto', () => {
      const d = [
        { id: 'barata', nombre: 'Barata', saldo: 500000, cuota_mensual: 20000, cae: 10 },
        { id: 'cara', nombre: 'Cara', saldo: 500000, cuota_mensual: 20000, cae: 50 },
      ];
      igual(planDeudas(d, 140000, 'avalancha').deudas[0].id, 'cara');
      igual(planDeudas(d, 140000, 'bola-de-nieve').deudas.length, 2);
    });
    prueba('Avalancha nunca paga más intereses que bola de nieve', () => {
      const d = [
        { id: 'a', nombre: 'A', saldo: 300000, cuota_mensual: 15000, cae: 45 },
        { id: 'b', nombre: 'B', saldo: 2000000, cuota_mensual: 80000, cae: 20 },
        { id: 'c', nombre: 'C', saldo: 900000, cuota_mensual: 30000, cae: 30 },
      ];
      const av = planDeudas(d, 175000, 'avalancha').interesTotal;
      const bn = planDeudas(d, 175000, 'bola-de-nieve').interesTotal;
      if (av > bn + 1) throw new Error(`avalancha ${av} > bola de nieve ${bn}`);
    });
    prueba('Detecta deudas que nunca se pagan (cuota menor que el interés)', () => {
      const p = planDeudas([{ id: 'a', nombre: 'A', saldo: 1000000, cuota_mensual: 10000, cae: 60 }]);
      igual(p.imposible, true); igual(p.meses, null);
    });
    prueba('La fecha de término de una deuda de 1 mes es este mes', () => {
      const p = planDeudas([{ id: 'a', nombre: 'A', saldo: 100, cuota_mensual: 100, cae: 0 }]);
      igual(p.deudas[0].mesTermino, mesActual());
    });

    prueba('Disponible = ingreso − fijos − cuotas − ahorro − gasto variable', () => {
      const mes = mesActual();
      datos.perfil = { ingreso_mensual: 1000000, meta_ahorro: 50000, presupuesto_deudas: 0 };
      datos.compromisos = [
        { id: 'c1', nombre: 'Arriendo', monto: 400000, activo: true },
        { id: 'c2', nombre: 'TV en cuotas', monto: 30000, activo: true, hasta_mes: sumarMeses(mes, -1) },
      ];
      datos.deudas = [{ id: 'd1', nombre: 'CMR', saldo: 500000, cuota_mensual: 100000, cae: 40 }];
      datos.movimientos = [
        { id: 'm1', fecha: mes + '-01', monto: 20000, tipo: 'gasto' },
        { id: 'm2', fecha: mes + '-01', monto: 400000, tipo: 'gasto', compromiso_id: 'c1' },
        { id: 'm3', fecha: mes + '-01', monto: 100000, tipo: 'gasto', deuda_id: 'd1' },
      ];
      const d = disponibleDelMes(mes);
      igual(d.fijos, 400000, 'la TV en cuotas ya terminó;');
      igual(d.paraVariable, 450000);
      igual(d.gastado, 20000, 'los pagos planificados no se cuentan dos veces;');
      igual(d.restante, 430000);
    });

    prueba('Los ingresos extra no suben lo que puedes gastar', () => {
      const mes = mesActual();
      datos.movimientos.push(
        { id: 'i1', fecha: mes + '-02', monto: 1000000, tipo: 'ingreso', categoria_id: 'sueldo' },
        { id: 'i2', fecha: mes + '-03', monto: 380000, tipo: 'ingreso', categoria_id: null, descripcion: 'cambio de reales' },
      );
      const d = disponibleDelMes(mes);
      igual(d.ingreso, 1000000);
      igual(d.ingresosExtra, 380000);
      igual(d.paraVariable, 450000);
    });

    prueba('El total para deudas nunca es menor que las cuotas mínimas', () => {
      datos.perfil.presupuesto_deudas = 50000;
      igual(destinoDeudas().total, 100000);
      datos.perfil.presupuesto_deudas = 300000;
      igual(destinoDeudas().total, 300000);
      igual(disponibleDelMes(mesActual()).extraDeudas, 200000);
    });

    prueba('Las deudas en pausa no descuentan cuota ni entran al plan', () => {
      datos.perfil.presupuesto_deudas = 0;
      datos.deudas.push({ id: 'papa', nombre: 'Papá', saldo: 1600000, cuota_mensual: 200000, cae: 0, estado: 'pausa' });
      igual(destinoDeudas().cuotas, 100000);
      igual(planDeudas(datos.deudas, 300000).deudas.map(x => x.id), ['d1']);
    });

    prueba('Una deuda con fecha límite queda pagada a tiempo aunque no tenga interés', () => {
      const limite = sumarMeses(mesActual(), 5);
      const d = [
        { id: 'tarjeta', nombre: 'Tarjeta', saldo: 3000000, cuota_mensual: 100000, cae: 45 },
        { id: 'mama', nombre: 'Mamá', saldo: 500000, cuota_mensual: 0, cae: 0, fecha_limite: limite },
      ];
      const p = planDeudas(d, 600000);
      const mama = p.deudas.find(x => x.id === 'mama');
      if (mama.mesTermino > limite) throw new Error(`terminó en ${mama.mesTermino}, límite ${limite}`);
      igual(p.fueraDePlazo.length, 0);
    });

    prueba('Avisa cuando una fecha límite no se alcanza', () => {
      const d = [{ id: 'mama', nombre: 'Mamá', saldo: 500000, cuota_mensual: 0, cae: 0, fecha_limite: mesActual() }];
      igual(planDeudas(d, 100000).fueraDePlazo.map(x => x.id), ['mama']);
    });

    prueba('Uso del cupo con alerta al 85%', () => {
      igual(usoCupo({ saldo: 800000, cupo_total: 1000000 }).estado, 'alerta');
      igual(usoCupo({ saldo: 900000, cupo_total: 1000000 }).estado, 'excedido');
      igual(usoCupo({ saldo: 100, cupo_total: 0 }), null);
    });

    prueba('Estados del presupuesto', () => {
      igual(estadoPresupuesto(50, 100), 'ok');
      igual(estadoPresupuesto(80, 100), 'alerta');
      igual(estadoPresupuesto(101, 100), 'excedido');
      igual(estadoPresupuesto(10, 0), 'sin-tope');
    });
    prueba('Leer montos escritos a la chilena', () => {
      igual(leerMonto('$12.990'), 12990);
      igual(leerMonto('1.500.000'), 1500000);
      igual(leerMonto('abc'), 0);
    });
    prueba('Sumar meses cruza el año', () => igual(sumarMeses('2026-11', 3), '2027-02'));
    // Correos de compra (fase 2). Todos inventados: nunca correos ni datos reales.
    const correo = (texto, extra = {}) => ({ remitente: 'Avisos <avisos@santander.cl>', asunto: 'Compra con tu tarjeta', texto, fecha: '2026-10-21', ...extra });
    prueba('Lee una compra escrita en una frase', () => {
      igual(leerCorreoDeCompra(correo('Se realizó una compra por $12.990 en UBER *TRIP el 21/10/2026 con tu tarjeta terminada en 1234.')),
        { tipo: 'gasto', monto: 12990, comercio: 'UBER *TRIP', tarjeta: '1234', fecha: '2026-10-21', lector: 'general' });
    });
    prueba('Lee una compra en formato de ficha', () => {
      const g = leerCorreoDeCompra(correo('Monto: $ 45.500\nComercio: LIDER EXPRESS PROVIDENCIA\nFecha: 21/10/2026\nTarjeta: ****5678'));
      igual([g.monto, g.comercio, g.tarjeta], [45500, 'LIDER EXPRESS PROVIDENCIA', '5678']);
    });
    prueba('Los centavos se redondean y no se leen como más dígitos', () => igual(leerCorreoDeCompra(correo('Compra por $12.990,50 en COPEC')).monto, 12991));
    prueba('No anota compras rechazadas, devoluciones ni publicidad', () => {
      igual(leerCorreoDeCompra(correo('Tu compra por $9.990 en NETFLIX fue rechazada')), null);
      igual(leerCorreoDeCompra(correo('Te hicimos una devolución de $5.000 por tu compra en FALABELLA')), null);
      igual(leerCorreoDeCompra(correo('Conoce nuestras ofertas', { asunto: 'Novedades' })), null);
    });
    prueba('No anota publicidad del banco ni compras en otra moneda', () => {
      igual(leerCorreoDeCompra(correo('Tu próxima compra en cuotas sin interés desde $10.000 en FALABELLA', { asunto: 'Compra en cuotas sin interés' })), null);
      igual(leerCorreoDeCompra(correo('Se realizó una compra por US$12.50 en AMAZON')), null);
    });
    prueba('Un aviso de compra con ofertas al pie igual se anota', () => {
      igual(leerCorreoDeCompra(correo('Se realizó una compra por $8.500 en STARBUCKS.\n\nConoce nuestras ofertas y promociones.')).monto, 8500);
    });
    // Transferencias: correos inventados con el formato de cada banco (los que
    // vienen solo en HTML llegan con una palabra por línea).
    const enLineas = texto => texto.split(' ').join('\n');
    prueba('Lee una transferencia enviada desde Santander, y no la que es a tu propio nombre', () => {
      const comprobante = destino => ({
        remitente: 'Santander <mensajeria@santander.cl>', asunto: 'Comprobante Transferencia de fondos', fecha: '2026-10-18',
        texto: `Comprobante\n Transferencia de fondos\n Estimado(a) ANA ROJAS PINO:\n Te enviamos el detalle de la transferencia realizada el 18/10/2026.\n Monto transferido\n $ 35.000\n Datos de origen\n Tipo de cuenta\n Cuenta Corriente\n Nº de cuenta\n 0-000-11-22333-0\n RUT\n 11.111.111-1\n Nombre\n ANA ROJAS PINO\n Comentario\n Datos de destino\n Nombre\n ${destino}\n RUT\n 22.222.222-2\n Banco\n Banco Estado\n Tipo de cuenta\n Cuenta Vista`,
      });
      igual(leerCorreoDeCompra(comprobante('Pedro Soto')),
        { tipo: 'gasto', monto: 35000, comercio: 'Transferencia a Pedro Soto', tarjeta: null, fecha: '2026-10-18', lector: 'santander-transferencia' });
      igual(leerCorreoDeCompra(comprobante('Ana Rojas Pino')), null, 'a su propio nombre:');
      const otraCuenta = comprobante('Ana María Rojas Pino');
      otraCuenta.texto = otraCuenta.texto.replace('22.222.222-2', '11.111.111-1');
      igual(leerCorreoDeCompra(otraCuenta), null, 'mismo RUT, nombre escrito distinto:');
    });
    prueba('Lee una transferencia enviada desde Mercado Pago aunque venga una palabra por línea', () => {
      const g = leerCorreoDeCompra({
        remitente: 'Mercado Pago <info@mercadopago.cl>', asunto: '¡Enviamos tu transferencia!', fecha: '2026-10-25',
        texto: enLineas('¡Enviamos tu transferencia! Ya enviamos tu transferencia de $ 10.000 Datos del beneficiario Nombre y apellido: Pedro Soto Entidad: Banco Estado Número de cuenta: 000011112222 Si no hiciste esta transferencia, avisanos'),
      });
      igual([g.tipo, g.monto, g.comercio], ['gasto', 10000, 'Transferencia a Pedro Soto']);
    });
    prueba('Lee una transferencia que te llegó (aviso de Banco de Chile) como ingreso', () => {
      const g = leerCorreoDeCompra({
        remitente: 'serviciodetransferencias@bancochile.cl', asunto: 'Aviso de transferencia de fondos', fecha: '2026-10-14',
        texto: 'Comprobante de transferencia electrónica de fondos\n Estimado(a): Ana\n Te informamos que nuestro(a) cliente Catalina Pérez Soto ha efectuado una transferencia\n de fondos a tu cuenta con el siguiente detalle:\n Datos de cuenta\n Fecha\n 14/10/2026\n Monto\n $20.000\n Número de comprobante\n TEF000',
      });
      igual([g.tipo, g.monto, g.comercio, g.lector], ['ingreso', 20000, 'Transferencia de Catalina Pérez Soto', 'bancochile-transferencia-recibida']);
    });
    // Tus cuentas: con tu RUT y tu nombre (Ajustes) no se anota la plata que
    // mueves entre tus propias cuentas. El RUT manda; el nombre es el respaldo
    // para los correos que no traen el RUT del otro lado.
    const YO = { rut: '11111111-1', nombres: ['Ana Rojas Pino'] };
    prueba('El RUT se normaliza y se revisa su dígito verificador', () => {
      igual(['11.111.111-1', '11111111-1', ' 22.222.222-2 ', '10.000.013-k', '10000013K', '11 111 111-1', '011.111.111-1', '999.999-K'].map(normalizarRut),
        ['11111111-1', '11111111-1', '22222222-2', '10000013-K', '10000013-K', '11111111-1', '11111111-1', '999999-K']);
      igual(['11.111.111-2', 'abc', '', '1-9', null, 11111111].map(normalizarRut), [null, null, null, null, null, null], 'inválidos:');
    });
    // Crear cuenta: el RUT y el nombre completo se piden al registrarse y pasan
    // solos a "Tus cuentas" la primera vez que la persona entra.
    prueba('Al crear la cuenta, el RUT tiene que tener bien el dígito verificador y el nombre al menos nombre y apellido', () => {
      igual(datosDeRegistro({ rut: '11.111.111-1', nombre: '  Ana   Rojas Pino ' }), { rut: '11111111-1', nombre: 'Ana Rojas Pino' });
      igual(datosDeRegistro({ rut: '11.111.111-2', nombre: 'Ana Rojas Pino' }).error, 'rut', 'dígito malo:');
      igual(datosDeRegistro({ rut: '', nombre: 'Ana Rojas Pino' }).error, 'rut', 'sin RUT:');
      igual(datosDeRegistro({ rut: '11111111-1', nombre: 'Ana' }).error, 'nombre', 'una sola palabra:');
      igual(datosDeRegistro({ rut: '11111111-1', nombre: 'Ana <b>Rojas</b>' }).error, 'nombre', 'con símbolos:');
      igual(datosDeRegistro({}).error, 'nombre', 'vacío: primero el nombre, como en el formulario:');
    });
    prueba('Al crear la cuenta, la fecha de nacimiento es opcional, pero si viene tiene que ser válida', () => {
      const base = { rut: '11111111-1', nombre: 'Ana Rojas Pino' };
      igual(datosDeRegistro({ ...base, fecha: '1990-05-17' }), { rut: '11111111-1', nombre: 'Ana Rojas Pino', fecha_nacimiento: '1990-05-17' });
      igual(datosDeRegistro({ ...base, fecha: '' }), { rut: '11111111-1', nombre: 'Ana Rojas Pino', fecha_nacimiento: null }, 'sin fecha:');
      igual(datosDeRegistro({ ...base, fecha: '1990-02-30' }).error, 'fecha', 'no existe:');
      igual(datosDeRegistro({ ...base, fecha: '9999-01-01' }).error, 'fecha', 'futura:');
    });
    prueba('La fecha de nacimiento del registro también llega al perfil, sin pisar la que ya está', () => {
      const vacio = { rut: null, nombres_propios: [], fecha_nacimiento: null };
      igual(perfilDesdeRegistro(vacio, { rut: '11111111-1', full_name: 'Ana Rojas Pino', fecha_nacimiento: '1990-05-17' }),
        { rut: '11111111-1', nombres_propios: ['Ana Rojas Pino'], fecha_nacimiento: '1990-05-17' });
      igual(perfilDesdeRegistro({ ...vacio, rut: '22222222-2' }, { rut: '11111111-1', fecha_nacimiento: '1990-05-17' }), { fecha_nacimiento: '1990-05-17' }, 'ya tenía RUT:');
      igual(perfilDesdeRegistro({ ...vacio, fecha_nacimiento: '1985-01-01' }, { fecha_nacimiento: '1990-05-17' }), null, 'ya tenía fecha:');
      igual(perfilDesdeRegistro(vacio, { fecha_nacimiento: '1990-02-30' }), null, 'fecha mala:');
      igual(perfilDesdeRegistro(vacio, { fecha_nacimiento: '1990-05-17', en_perfil: true }), null, 'ya se pasó:');
    });
    prueba('Lo que se dio al crear la cuenta llega a "Tus cuentas" solo si ahí no hay un RUT', () => {
      const registro = { rut: '11111111-1', full_name: 'Ana Rojas Pino' };
      igual(perfilDesdeRegistro({ rut: null, nombres_propios: [] }, registro), { rut: '11111111-1', nombres_propios: ['Ana Rojas Pino'] });
      igual(perfilDesdeRegistro({ rut: null, nombres_propios: ['ANA ROJAS PINO', 'Ana Rojas'] }, registro),
        { rut: '11111111-1', nombres_propios: ['ANA ROJAS PINO', 'Ana Rojas'] }, 'el nombre ya estaba:');
      igual(perfilDesdeRegistro({ rut: '22222222-2', nombres_propios: [] }, registro), null, 'ya tiene RUT:');
      igual(perfilDesdeRegistro({ rut: null, nombres_propios: [] }, { ...registro, en_perfil: true }), null, 'ya se pasó y lo borró en Ajustes:');
      igual(perfilDesdeRegistro({ rut: null, nombres_propios: [] }, { rut: '11111111-2', full_name: 'Ana Rojas Pino' }), null, 'RUT malo:');
      igual(perfilDesdeRegistro({ rut: null, nombres_propios: [] }, {}), null, 'cuenta antigua sin datos:');
      igual(perfilDesdeRegistro({ rut: null, nombres_propios: [] }, { rut: '11111111-1', full_name: 'Ana' }),
        { rut: '11111111-1', nombres_propios: [] }, 'nombre que no sirve:');
    });
    prueba('Dos nombres son la misma persona si son iguales, o si el más corto tiene tres palabras y todas están en el otro', () => {
      igual(esMismoNombre('Ana Rojas Pino', 'ANA ROJAS PINO'), true);
      igual(esMismoNombre('Ána Rójas Pino', 'ana  rojas pino'), true, 'sin tildes ni mayúsculas:');

      igual(avisoCumple('1990-11-20', '2026-10-21', null, [...CATALOGO, conTiempo]), { tipo: 'pronto', dias: 30, cuantos: 4, antes: 2 });
      igual(avisoCumple('1990-11-20', '2026-10-20', null, [...CATALOGO, conTiempo]), null, '31 días antes:');
      igual(avisoCumple('1990-11-20', '2026-10-21', null, CATALOGO), null, 'sin esa anticipación, 30 días es muy pronto:');
    });
    prueba('Los regalos se filtran por tipo, por cuándo valen y por los que no piden inscribirse; van primero los del día y los confirmados en web', () => {
      const lista = [
        { id: 'a', marca: 'Zeta', tipo: 'comida', cuando: 'mes', segun: 'prensa', antes: 'Baja la app' },
        { id: 'b', marca: 'Beta', tipo: 'cine', cuando: 'dia', segun: 'prensa', antes: null },
        { id: 'c', marca: 'Alfa', tipo: 'comida', cuando: 'dia', segun: 'prensa', antes: null },
        { id: 'd', marca: 'Gama', tipo: 'comida', cuando: 'mes', segun: 'web', antes: null },
      ];
      igual(filtrarRegalos(lista).map(b => b.id), ['c', 'b', 'd', 'a'], 'orden:');
      igual(filtrarRegalos(lista, { tipo: 'comida' }).map(b => b.id), ['c', 'd', 'a']);
      igual(filtrarRegalos(lista, { cuando: 'mes' }).map(b => b.id), ['d', 'a']);
      igual(filtrarRegalos(lista, { sinInscribirse: true }).map(b => b.id), ['c', 'b', 'd']);
      igual(filtrarRegalos(lista, { tipo: 'comida', cuando: 'mes', sinInscribirse: true }).map(b => b.id), ['d']);
    });
    prueba('Solo se acepta un link de Atajos de iCloud para instalar el Atajo', () => {
      const id = '0123456789abcdef0123456789abcdef';
      igual(linkDeAtajo(`https://www.icloud.com/shortcuts/${id}`), `https://www.icloud.com/shortcuts/${id}`);
      igual(linkDeAtajo(` https://www.icloud.com/shortcuts/${id}/ `), `https://www.icloud.com/shortcuts/${id}/`, 'con espacios y barra:');
      igual(linkDeAtajo(''), null, 'vacío:');
      igual(linkDeAtajo(`http://www.icloud.com/shortcuts/${id}`), null, 'sin https:');
      igual(linkDeAtajo(`https://icloud.com.malo.cl/shortcuts/${id}`), null, 'otro dominio:');
      igual(linkDeAtajo(`javascript:alert(1)//https://www.icloud.com/shortcuts/${id}`), null);
      igual(linkDeAtajo(null), null);
    });
    prueba('Tu ruta parte de cero cada año', () => {
      igual(rutaDelAnio({ anio: 2026, elegidos: ['cafe'], usados: ['cafe'] }, 2026), { anio: 2026, elegidos: ['cafe'], usados: ['cafe'] });
      igual(rutaDelAnio({ anio: 2025, elegidos: ['cafe'], usados: [] }, 2026), { anio: 2026, elegidos: [], usados: [] });
      igual(rutaDelAnio(null, 2026), { anio: 2026, elegidos: [], usados: [] });
    });
    prueba('Cada beneficio de cumpleaños del catálogo está bien escrito y no se repite', () => {
      const ids = new Set();
      for (const b of BENEFICIOS_CUMPLE) {
        const quien = `${b.marca} (${b.id}):`;
        if (!/^[a-z0-9-]{1,40}$/.test(b.id) || ids.has(b.id)) throw new Error(`${quien} id inválido o repetido`);
        ids.add(b.id);
        if (!CUANDO_CUMPLE[b.cuando]) throw new Error(`${quien} "cuando" inválido`);
        if (!/^https:\/\//.test(b.fuente)) throw new Error(`${quien} la fuente no es https`);
        if (b.hasta !== null && !/^\d{4}-\d{2}-\d{2}$/.test(b.hasta)) throw new Error(`${quien} fecha "hasta" inválida`);
        if (!b.regalo || !b.icono || !b.donde) throw new Error(`${quien} le falta regalo, ícono o dónde`);
        if (!['web', 'prensa'].includes(b.segun)) throw new Error(`${quien} "segun" tiene que ser 'web' o 'prensa'`);
        if (!TIPOS_CUMPLE[b.tipo]) throw new Error(`${quien} "tipo" desconocido`);
        if (b.segun === 'prensa' && !/^\d{4}-\d{2}$/.test(b.visto ?? '')) throw new Error(`${quien} lo de prensa necesita "visto" (AAAA-MM de la nota)`);
        if (b.anticipacion != null && !(Number.isInteger(b.anticipacion) && b.anticipacion > 0 && b.anticipacion <= 90)) throw new Error(`${quien} "anticipacion" son días entre 1 y 90`);
        if (b.tarjeta != null) {
          const { banco, tipo } = separarTarjeta(b.tarjeta);
          if (!TARJETAS.some(t => t.id === banco)) throw new Error(`${quien} "tarjeta" de un banco que no está en el catálogo`);
          if (tipo && !TIPOS[banco]?.some(t => t.id === tipo)) throw new Error(`${quien} "tarjeta" con un tipo que no está dibujado`);
        }
        if (b.noVale && !(b.noVale.meses ?? []).every(m => Number.isInteger(m) && m >= 1 && m <= 12)) throw new Error(`${quien} "noVale.meses" inválido`);
        if (b.noVale && !(b.noVale.diasSemana ?? []).every(d => Number.isInteger(d) && d >= 1 && d <= 7)) throw new Error(`${quien} "noVale.diasSemana" inválido`);
      }
    });

    const fallas = resultados.filter(([, e]) => e);
    document.getElementById('resumen').innerHTML = fallas.length
      ? `<span class="falla">${fallas.length} de ${resultados.length} pruebas fallaron</span>`
      : `<span class="ok">Las ${resultados.length} pruebas pasaron</span>`;
    document.getElementById('resultados').innerHTML = resultados
      .map(([n, e]) => `<li class="${e ? 'falla' : 'ok'}">${e ? '✕' : '✓'} ${n}${e ? ' — ' + e : ''}</li>`).join('');
  </script>
