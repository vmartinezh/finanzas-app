<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas · Simplifica</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 24px; background: #fcfcfb; color: #0b0b0b; }
    .ok { color: #0a7f0a; } .falla { color: #c13030; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #1a1a19; color: #f0efec; } .ok { color: #3cb83c; } .falla { color: #ec6b6b; } }
  </style>
</head>
<body>
  <h1>Pruebas</h1>
  <p id="resumen">Corriendo…</p>
  <ol id="resultados"></ol>
  <script type="module">
    // Abre esta página con la app servida (ver README) para correr las pruebas.
    // No toca tus datos: trabaja sobre datos en memoria.
    import { datos } from '../js/db.js';
    import { clasificar } from '../js/clasificador.js';
    import { planDeudas, disponibleDelMes, estadoPresupuesto, destinoDeudas, usoCupo, cuotasDeCobro, estadoCobro, resumenMeDeben, cobrosDeHoy, dividirGasto } from '../js/calculos.js';
    import { leerMonto, sumarMeses, sumarMesesFecha, mesActual, esc } from '../js/util.js';
    import { normalizarFila, normalizarTabla, normalizarPerfil, prepararRespaldo } from '../js/validar.js';
    import { BENEFICIOS, TARJETAS, RUBROS, beneficiosDelDia, diaSemana, textoDias } from '../js/beneficios.js';

    const resultados = [];
    const prueba = (nombre, fn) => {
      try { fn(); resultados.push([nombre, null]); }
      catch (e) { resultados.push([nombre, e.message]); }
    };
    const igual = (real, esperado, msg = '') => {
      if (JSON.stringify(real) !== JSON.stringify(esperado)) throw new Error(`${msg} esperaba ${JSON.stringify(esperado)}, llegó ${JSON.stringify(real)}`);
    };

    const cat = (id, nombre, extra = {}) => ({ id, nombre, icono: '', tipo: 'gasto', ...extra });
    datos.categorias = [cat('super', 'Supermercado'), cat('comida', 'Comida fuera'), cat('trans', 'Transporte'), cat('regalos', 'Regalos'), cat('mascota', 'Mascota', { palabras: 'veterinaria, pet' }), cat('sueldo', 'Sueldo', { tipo: 'ingreso' })];
    datos.eventos = [{ id: 'matri', nombre: 'Matrimonio', palabras: 'matri, boda', activo: true }, { id: 'viejo', nombre: 'Mudanza', activo: false }];
    datos.reglas = [{ id: 'r1', patron: 'mercadopago*tienda', categoria_id: 'regalos' }];

    prueba('Comercio conocido por palabra clave', () => igual(clasificar({ comercio: 'LIDER EXPRESS' }).categoria_id, 'super'));
    prueba('La palabra más larga gana: "uber eats" es comida, no transporte', () => igual(clasificar({ comercio: 'UBER EATS' }).categoria_id, 'comida'));
    prueba('Uber solo es transporte', () => igual(clasificar({ comercio: 'UBER' }).categoria_id, 'trans'));
    prueba('Lo que escribes manda sobre el comercio', () => igual(clasificar({ comercio: 'UBER', descripcion: 'regalo para la suegra' }).categoria_id, 'regalos'));
    prueba('Detecta el evento por palabra clave ("matri")', () => igual(clasificar({ comercio: 'UBER', descripcion: 'uber al aeropuerto para lo del matri' }).evento_id, 'matri'));
    prueba('No asocia eventos cerrados', () => igual(clasificar({ descripcion: 'cajas para la mudanza' }).evento_id, null));
    prueba('Usa las reglas aprendidas', () => igual(clasificar({ comercio: 'MercadoPago*Tienda' }).categoria_id, 'regalos'));
    prueba('Palabras clave propias de una categoría', () => igual(clasificar({ descripcion: 'vacuna en la veterinaria' }).categoria_id, 'mascota'));
    prueba('Palabras cortas no calzan dentro de otras ("tag" en "etiqueta")', () => igual(clasificar({ descripcion: 'etagere' }).categoria_id, null));
    prueba('Acentos y mayúsculas no importan', () => igual(clasificar({ descripcion: 'ALMACÉN de la esquina' }).categoria_id, 'super'));
    prueba('Nunca clasifica un gasto como ingreso', () => igual(clasificar({ descripcion: 'sueldo' }).categoria_id, null));

    prueba('Deuda sin interés: 1.000 con cuota 100 = 10 meses', () => {
      const p = planDeudas([{ id: 'a', nombre: 'A', saldo: 1000, cuota_mensual: 100, cae: 0 }]);
      igual(p.meses, 10); igual(Math.round(p.interesTotal), 0);
    });
    prueba('El abono extra acorta el plazo', () => {
      const d = [{ id: 'a', nombre: 'A', saldo: 1000, cuota_mensual: 100, cae: 0 }];
      igual(planDeudas(d, 200).meses, 5, 'con 200 al mes en total;');
    });
    prueba('Avalancha termina primero la de CAE más alto', () => {
      const d = [
        { id: 'barata', nombre: 'Barata', saldo: 500000, cuota_mensual: 20000, cae: 10 },
        { id: 'cara', nombre: 'Cara', saldo: 500000, cuota_mensual: 20000, cae: 50 },
      ];
      igual(planDeudas(d, 140000, 'avalancha').deudas[0].id, 'cara');
      igual(planDeudas(d, 140000, 'bola-de-nieve').deudas.length, 2);
    });
    prueba('Avalancha nunca paga más intereses que bola de nieve', () => {
      const d = [
        { id: 'a', nombre: 'A', saldo: 300000, cuota_mensual: 15000, cae: 45 },
        { id: 'b', nombre: 'B', saldo: 2000000, cuota_mensual: 80000, cae: 20 },
        { id: 'c', nombre: 'C', saldo: 900000, cuota_mensual: 30000, cae: 30 },
      ];
      const av = planDeudas(d, 175000, 'avalancha').interesTotal;
      const bn = planDeudas(d, 175000, 'bola-de-nieve').interesTotal;
      if (av > bn + 1) throw new Error(`avalancha ${av} > bola de nieve ${bn}`);
    });
    prueba('Detecta deudas que nunca se pagan (cuota menor que el interés)', () => {
      const p = planDeudas([{ id: 'a', nombre: 'A', saldo: 1000000, cuota_mensual: 10000, cae: 60 }]);
      igual(p.imposible, true); igual(p.meses, null);
    });
    prueba('La fecha de término de una deuda de 1 mes es este mes', () => {
      const p = planDeudas([{ id: 'a', nombre: 'A', saldo: 100, cuota_mensual: 100, cae: 0 }]);
      igual(p.deudas[0].mesTermino, mesActual());
    });

    prueba('Disponible = ingreso − fijos − cuotas − ahorro − gasto variable', () => {
      const mes = mesActual();
      datos.perfil = { ingreso_mensual: 1000000, meta_ahorro: 50000, presupuesto_deudas: 0 };
      datos.compromisos = [
        { id: 'c1', nombre: 'Arriendo', monto: 400000, activo: true },
        { id: 'c2', nombre: 'TV en cuotas', monto: 30000, activo: true, hasta_mes: sumarMeses(mes, -1) },
      ];
      datos.deudas = [{ id: 'd1', nombre: 'CMR', saldo: 500000, cuota_mensual: 100000, cae: 40 }];
      datos.movimientos = [
        { id: 'm1', fecha: mes + '-01', monto: 20000, tipo: 'gasto' },
        { id: 'm2', fecha: mes + '-01', monto: 400000, tipo: 'gasto', compromiso_id: 'c1' },
        { id: 'm3', fecha: mes + '-01', monto: 100000, tipo: 'gasto', deuda_id: 'd1' },
      ];
      const d = disponibleDelMes(mes);
      igual(d.fijos, 400000, 'la TV en cuotas ya terminó;');
      igual(d.paraVariable, 450000);
      igual(d.gastado, 20000, 'los pagos planificados no se cuentan dos veces;');
      igual(d.restante, 430000);
    });

    prueba('Los ingresos extra no suben lo que puedes gastar', () => {
      const mes = mesActual();
      datos.movimientos.push(
        { id: 'i1', fecha: mes + '-02', monto: 1000000, tipo: 'ingreso', categoria_id: 'sueldo' },
        { id: 'i2', fecha: mes + '-03', monto: 380000, tipo: 'ingreso', categoria_id: null, descripcion: 'cambio de reales' },
      );
      const d = disponibleDelMes(mes);
      igual(d.ingreso, 1000000);
      igual(d.ingresosExtra, 380000);
      igual(d.paraVariable, 450000);
    });

    prueba('El total para deudas nunca es menor que las cuotas mínimas', () => {
      datos.perfil.presupuesto_deudas = 50000;
      igual(destinoDeudas().total, 100000);
      datos.perfil.presupuesto_deudas = 300000;
      igual(destinoDeudas().total, 300000);
      igual(disponibleDelMes(mesActual()).extraDeudas, 200000);
    });

    prueba('Las deudas en pausa no descuentan cuota ni entran al plan', () => {
      datos.perfil.presupuesto_deudas = 0;
      datos.deudas.push({ id: 'papa', nombre: 'Papá', saldo: 1600000, cuota_mensual: 200000, cae: 0, estado: 'pausa' });
      igual(destinoDeudas().cuotas, 100000);
      igual(planDeudas(datos.deudas, 300000).deudas.map(x => x.id), ['d1']);
    });

    prueba('Una deuda con fecha límite queda pagada a tiempo aunque no tenga interés', () => {
      const limite = sumarMeses(mesActual(), 5);
      const d = [
        { id: 'tarjeta', nombre: 'Tarjeta', saldo: 3000000, cuota_mensual: 100000, cae: 45 },
        { id: 'mama', nombre: 'Mamá', saldo: 500000, cuota_mensual: 0, cae: 0, fecha_limite: limite },
      ];
      const p = planDeudas(d, 600000);
      const mama = p.deudas.find(x => x.id === 'mama');
      if (mama.mesTermino > limite) throw new Error(`terminó en ${mama.mesTermino}, límite ${limite}`);
      igual(p.fueraDePlazo.length, 0);
    });

    prueba('Avisa cuando una fecha límite no se alcanza', () => {
      const d = [{ id: 'mama', nombre: 'Mamá', saldo: 500000, cuota_mensual: 0, cae: 0, fecha_limite: mesActual() }];
      igual(planDeudas(d, 100000).fueraDePlazo.map(x => x.id), ['mama']);
    });

    prueba('Uso del cupo con alerta al 85%', () => {
      igual(usoCupo({ saldo: 800000, cupo_total: 1000000 }).estado, 'alerta');
      igual(usoCupo({ saldo: 900000, cupo_total: 1000000 }).estado, 'excedido');
      igual(usoCupo({ saldo: 100, cupo_total: 0 }), null);
    });

    prueba('Estados del presupuesto', () => {
      igual(estadoPresupuesto(50, 100), 'ok');
      igual(estadoPresupuesto(80, 100), 'alerta');
      igual(estadoPresupuesto(101, 100), 'excedido');
      igual(estadoPresupuesto(10, 0), 'sin-tope');
    });
    prueba('Leer montos escritos a la chilena', () => {
      igual(leerMonto('$12.990'), 12990);
      igual(leerMonto('1.500.000'), 1500000);
      igual(leerMonto('abc'), 0);
    });
    prueba('Sumar meses cruza el año', () => igual(sumarMeses('2026-11', 3), '2027-02'));

    // Seguridad: un respaldo manipulado no puede meter HTML ni valores raros.
    const ID = '0f8fad5b-d9cb-469f-a165-70867728950e';
    const ATAQUE = '"><img src=x onerror=alert(1)>';
    prueba('Descarta filas cuyo id no es un UUID', () => {
      igual(normalizarFila('deudas', { id: ATAQUE, nombre: 'x', saldo: 1 }), null);
      igual(normalizarTabla('deudas', [{ id: ATAQUE }, { id: ID, nombre: 'ok' }]).length, 1);
    });
    prueba('Los números manipulados quedan como números', () => {
      const d = normalizarFila('deudas', { id: ID, nombre: 'x', saldo: ATAQUE, dia_pago: ATAQUE, cae: '-5', cupo_total: 'mil' });
      igual([d.saldo, d.dia_pago, d.cae, d.cupo_total], [0, null, 0, null]);
    });
    prueba('Los valores de lista solo aceptan opciones conocidas', () => {
      const m = normalizarFila('movimientos', { id: ID, fecha: '2026-10-12', monto: 100, tipo: ATAQUE, estado: ATAQUE, origen: ATAQUE });
      igual([m.tipo, m.estado, m.origen], ['gasto', 'clasificado', 'manual']);
    });
    prueba('Movimientos sin fecha válida se descartan', () => {
      igual(normalizarFila('movimientos', { id: ID, fecha: ATAQUE, monto: 1 }), null);
      igual(normalizarFila('movimientos', { id: ID, fecha: '2026-13-40', monto: 1 }), null);
    });
    prueba('Las referencias inválidas se anulan y los textos se acotan', () => {
      const c = normalizarFila('compromisos', { id: ID, nombre: 'a'.repeat(500), categoria_id: ATAQUE, pagados: ['2026-10', ATAQUE, '2026-10'] });
      igual([c.nombre.length, c.categoria_id, c.pagados], [80, null, ['2026-10']]);
    });
    prueba('Los textos sí se guardan, y al mostrarlos se escapan', () => {
      const e = normalizarFila('eventos', { id: ID, nombre: ATAQUE });
      igual(e.nombre, ATAQUE);
      if (esc(e.nombre).includes('<')) throw new Error('esc() dejó pasar "<"');
    });
    prueba('El perfil solo conserva campos conocidos', () => {
      igual(normalizarPerfil({ ingreso_mensual: '1500000', revisado_mes: ATAQUE, raro: 1 }),
        { ingreso_mensual: 1500000, meta_ahorro: 0, presupuesto_deudas: 0, revisado_mes: null, tarjetas: [] });
    });
    prueba('Las tarjetas del perfil solo aceptan ids simples, sin repetir', () => {
      igual(normalizarPerfil({ tarjetas: ['santander', ATAQUE, 'santander', 7, 'lider-bci'] }).tarjetas, ['santander', 'lider-bci']);
      igual(normalizarPerfil({ tarjetas: 'santander' }).tarjetas, []);
    });

    const RESPALDO = () => ({
      version: 1,
      perfil: { ingreso_mensual: 900000, pago_extra_deudas: 50000 },
      categorias: [{ id: ID, nombre: 'Súper' }, { id: ID, nombre: 'Repetida' }],
      deudas: [{ id: '33333333-3333-4333-8333-333333333333', nombre: 'CMR', cuota_mensual: 40000 }],
      movimientos: [
        { id: '44444444-4444-4444-8444-444444444444', fecha: '2026-10-01', monto: 1, categoria_id: ID, deuda_id: '33333333-3333-4333-8333-333333333333', id_externo: 'correo-1' },
        { id: '55555555-5555-4555-8555-555555555555', fecha: '2026-10-02', monto: 2, id_externo: 'correo-1' },
        { id: '66666666-6666-4666-8666-666666666666', fecha: '2026-10-03', monto: 3, evento_id: '77777777-7777-4777-8777-777777777777' },
      ],
      reglas: [{ id: '88888888-8888-4888-8888-888888888888', patron: 'uber', categoria_id: ID }, { id: '99999999-9999-4999-8999-999999999999', patron: 'uber', categoria_id: ID }],
    });
    const contador = () => { let n = 0; return () => `00000000-0000-4000-8000-${String(++n).padStart(12, '0')}`; };
    prueba('Restaurar: cada fila recibe un id nuevo y los enlaces lo siguen', () => {
      const { tablas } = prepararRespaldo(RESPALDO(), contador());
      const cat = tablas.categorias[0].id, deuda = tablas.deudas[0].id;
      if (cat === ID) throw new Error('la categoría conservó su id');
      igual([tablas.movimientos[0].categoria_id, tablas.movimientos[0].deuda_id, tablas.reglas[0].categoria_id], [cat, deuda, cat]);
    });
    prueba('Restaurar: lo repetido se guarda una sola vez', () => {
      const { tablas } = prepararRespaldo(RESPALDO(), contador());
      igual(tablas.categorias.map(c => c.nombre), ['Súper']);
      igual(tablas.reglas.length, 1, 'patrón repetido;');
      igual(tablas.movimientos.map(m => m.monto), [1, 3], 'mismo correo del banco;');
    });
    prueba('Restaurar: cuenta los enlaces soltados y las filas que no se usaron', () => {
      const { tablas, sueltos, descartadas } = prepararRespaldo(RESPALDO(), contador());
      igual(tablas.movimientos[1].evento_id, null);
      igual([sueltos, descartadas], [1, 3], 'una categoría, un movimiento y una regla repetidos;');
    });
    prueba('Restaurar: los enlaces rotos se sueltan y los válidos se mantienen', () => {
      const CAT = '11111111-1111-4111-8111-111111111111', OTRA = '22222222-2222-4222-8222-222222222222';
      const { tablas } = prepararRespaldo({
        version: 1, categorias: [{ id: CAT, nombre: 'Súper' }],
        compromisos: [{ id: ID, nombre: 'Luz', categoria_id: OTRA }, { id: OTRA, nombre: 'Agua', categoria_id: CAT }],
        movimientos: [{ id: CAT, fecha: '2026-10-01', monto: 1, categoria_id: CAT, evento_id: OTRA, compromiso_id: ID, deuda_id: OTRA }],
      }, contador());
      const cat = tablas.categorias[0].id, luz = tablas.compromisos[0].id;
      igual(tablas.compromisos.map(c => c.categoria_id), [null, cat], 'sin eventos ni deudas en el respaldo;');
      const m = tablas.movimientos[0];
      igual([m.categoria_id, m.evento_id, m.compromiso_id, m.deuda_id], [cat, null, luz, null]);
    });
    prueba('Restaurar: una regla repetida sin categoría no le gana a su gemela válida', () => {
      const r = RESPALDO();
      r.reglas = [{ id: '88888888-8888-4888-8888-888888888888', patron: 'uber', categoria_id: '22222222-2222-4222-8222-222222222222' }, { id: '99999999-9999-4999-8999-999999999999', patron: 'uber', categoria_id: ID }];
      const { tablas } = prepararRespaldo(r, contador());
      igual(tablas.reglas.map(x => x.categoria_id), [tablas.categorias[0].id]);
    });
    prueba('Las fechas que no existen se descartan (31 de febrero)', () => {
      igual(normalizarFila('movimientos', { id: ID, fecha: '2026-02-31', monto: 1 }), null);
      igual(normalizarFila('movimientos', { id: ID, fecha: '2028-02-29', monto: 1 }).fecha, '2028-02-29');
    });
    prueba('Restaurar: el perfil antiguo pasa del abono extra al total para deudas', () => {
      const { perfil } = prepararRespaldo(RESPALDO(), contador());
      igual([perfil.ingreso_mensual, perfil.presupuesto_deudas, 'pago_extra_deudas' in perfil], [900000, 90000, false]);
    });
    prueba('Restaurar: rechaza archivos que no son respaldos o no traen categorías', () => {
      let errores = 0;
      for (const malo of [null, { version: 2 }, { version: 1, categorias: [] }]) {
        try { prepararRespaldo(malo, contador()); } catch { errores++; }
      }
      igual(errores, 3);
    });

    // Me deben
    prueba('Sumar meses a una fecha: el 31 pasa al último día del mes corto', () => {
      igual(sumarMesesFecha('2026-01-31', 1), '2026-02-28');
      igual(sumarMesesFecha('2026-10-30', 2), '2026-12-30');
      igual(sumarMesesFecha('2026-12-15', 1), '2027-01-15');
      igual(sumarMesesFecha('2028-01-31', 1), '2028-02-29');
    });
    prueba('Cuotas de un cobro: reparten el total exacto, mes a mes', () => {
      igual(cuotasDeCobro({ monto_total: 81000, cuotas: 2, primer_vencimiento: '2026-10-31' }),
        [{ numero: 1, monto: 40500, vence: '2026-10-31' }, { numero: 2, monto: 40500, vence: '2026-11-30' }]);
      igual(cuotasDeCobro({ monto_total: 100, cuotas: 3 }).map(c => [c.monto, c.vence]), [[34, null], [33, null], [33, null]]);
    });
    const conMovimientos = (movs, fn) => {
      const antes = datos.movimientos;
      datos.movimientos = movs;
      try { fn(); } finally { datos.movimientos = antes; }
    };
    const ZAPATILLAS = { id: 'zap', persona_id: 'mati', concepto: 'Zapatillas', monto_total: 81000, cuotas: 2, primer_vencimiento: '2026-10-30', estado: 'pendiente' };
    prueba('Estado de un cobro: cuota pagada, próxima y atraso', () => {
      conMovimientos([{ id: 'p1', fecha: '2026-10-29', monto: 40500, tipo: 'ingreso', cobro_id: 'zap' }], () => {
        const e = estadoCobro(ZAPATILLAS, '2026-11-01');
        igual([e.pagado, e.pendiente, e.cuotasPagadas], [40500, 40500, 1]);
        igual(e.proxima, { numero: 2, monto: 40500, vence: '2026-11-30' });
        igual(e.situacion, 'pendiente');
        igual(estadoCobro(ZAPATILLAS, '2026-11-30').situacion, 'hoy');
        igual(estadoCobro(ZAPATILLAS, '2026-12-01').situacion, 'atrasado');
      });
    });
    prueba('Si se atrasó en varias cuotas, lo vencido las suma todas', () => {
      conMovimientos([], () => {
        const e = estadoCobro({ ...ZAPATILLAS, cuotas: 3, monto_total: 121500 }, '2026-12-01');
        igual([e.situacion, e.proxima.monto, e.vencido], ['atrasado', 40500, 81000]);
        igual(estadoCobro(ZAPATILLAS, '2026-10-01').vencido, 0);
      });
    });
    prueba('Un pago marcado como sueldo no se cuenta dos veces', () => {
      const mes = mesActual();
      conMovimientos([{ id: 'dev', fecha: mes + '-05', monto: 30000, tipo: 'ingreso', cobro_id: 'zap', categoria_id: 'sueldo' }], () => {
        igual(disponibleDelMes(mes).cobrado, 0);
      });
    });
    prueba('Un pago parcial deja la cuota a medias', () => {
      conMovimientos([{ id: 'p1', fecha: '2026-10-29', monto: 20000, tipo: 'ingreso', cobro_id: 'zap' }], () => {
        const e = estadoCobro(ZAPATILLAS, '2026-10-01');
        igual([e.cuotasPagadas, e.proxima.numero, e.proxima.monto], [0, 1, 20500]);
      });
    });
    prueba('Pagado completo o dado por perdido: ya no está pendiente', () => {
      conMovimientos([{ id: 'p1', fecha: '2026-10-29', monto: 81000, tipo: 'ingreso', cobro_id: 'zap' }], () => {
        igual(estadoCobro(ZAPATILLAS, '2027-01-01').situacion, 'pagado');
      });
      conMovimientos([], () => {
        const e = estadoCobro({ ...ZAPATILLAS, estado: 'perdonado' }, '2027-01-01');
        igual([e.situacion, e.saldado, e.proxima], ['perdonado', true, null]);
      });
    });
    prueba('Me deben: personas ordenadas por urgencia, y lo de hoy para Inicio', () => {
      const antes = { personas: datos.personas, cobros: datos.cobros };
      datos.personas = [{ id: 'diego', nombre: 'Diego' }, { id: 'mati', nombre: 'Matías' }, { id: 'cata', nombre: 'Cata' }, { id: 'sofi', nombre: 'Sofi' }, { id: 'tomi', nombre: 'Tomi' }];
      datos.cobros = [
        { id: 'c1', persona_id: 'diego', concepto: 'Préstamo', monto_total: 60000, cuotas: 1, primer_vencimiento: '2026-10-30' },
        { id: 'c2', persona_id: 'mati', concepto: 'Zapatillas', monto_total: 80000, cuotas: 2, primer_vencimiento: '2026-10-10' },
        { id: 'c3', persona_id: 'cata', concepto: 'Asado', monto_total: 20000, cuotas: 1, primer_vencimiento: '2026-10-16' },
        { id: 'c4', persona_id: 'sofi', concepto: 'Entradas', monto_total: 15000, cuotas: 1 },
        { id: 'c5', persona_id: 'tomi', concepto: 'Pizza', monto_total: 8000, cuotas: 1, primer_vencimiento: '2026-10-01' },
      ];
      try {
        conMovimientos([{ id: 'p5', fecha: '2026-10-01', monto: 8000, tipo: 'ingreso', cobro_id: 'c5' }], () => {
          const r = resumenMeDeben('2026-10-16');
          igual(r.personas.map(p => p.persona.nombre), ['Matías', 'Cata', 'Diego', 'Sofi']);
          igual([r.total, r.atrasados, r.hoy], [175000, 1, 1]);
          igual(r.saldados.map(x => x.c.concepto), ['Pizza']);
          igual(cobrosDeHoy('2026-10-16').map(x => x.c.concepto), ['Zapatillas', 'Asado']);
        });
      } finally { Object.assign(datos, antes); }
    });
    prueba('Dividir un gasto: partes enteras que suman el total', () => {
      igual(dividirGasto(100000, 4, true), { porPersona: [20000, 20000, 20000, 20000], tuParte: 20000 });
      igual(dividirGasto(100001, 2, false), { porPersona: [50001, 50000], tuParte: 0 });
      igual(dividirGasto(10, 3, true), { porPersona: [3, 3, 2], tuParte: 2 });
      igual(dividirGasto(5000, 0, true), { porPersona: [], tuParte: 5000 });
    });
    prueba('Lo que te devuelven sí suma a lo que puedes gastar; los bonos no', () => {
      const mes = mesActual();
      conMovimientos([], () => {
        const base = disponibleDelMes(mes);
        datos.movimientos = [
          { id: 'dev', fecha: mes + '-05', monto: 30000, tipo: 'ingreso', cobro_id: 'zap' },
          { id: 'bono', fecha: mes + '-05', monto: 50000, tipo: 'ingreso' },
        ];
        const d = disponibleDelMes(mes);
        igual([d.cobrado, d.ingresosExtra, d.restante - base.restante], [30000, 50000, 30000]);
      });
    });
    prueba('Respaldos: un cobro sin persona se descarta y los enlaces siguen a los ids nuevos', () => {
      const P = 'aaaaaaaa-aaaa-4aaa-8aaa-000000000001', C = 'aaaaaaaa-aaaa-4aaa-8aaa-000000000002', H = 'aaaaaaaa-aaaa-4aaa-8aaa-000000000003';
      igual(normalizarFila('cobros', { id: C, concepto: 'x', monto_total: 1 }), null);
      igual(normalizarFila('cobros', { id: C, persona_id: P, concepto: ATAQUE, monto_total: '5', cuotas: 999 }).cuotas, 1);
      const { tablas } = prepararRespaldo({
        version: 1, categorias: [{ id: ID, nombre: 'Súper' }], personas: [{ id: P, nombre: 'Cata' }],
        cobros: [{ id: C, persona_id: P, concepto: 'Asado', monto_total: 20000 }, { id: H, persona_id: ID, concepto: 'Huérfano', monto_total: 1 }],
        movimientos: [{ id: ID, fecha: '2026-10-16', monto: 5000, tipo: 'ingreso', cobro_id: C }],
      }, contador());
      igual(tablas.cobros.map(c => c.concepto), ['Asado']);
      igual([tablas.cobros[0].persona_id, tablas.movimientos[0].cobro_id], [tablas.personas[0].id, tablas.cobros[0].id]);
    });

    // Descuentos de las tarjetas
    prueba('Día de la semana: lunes = 1, domingo = 7', () => {
      igual(diaSemana('2026-10-12'), 1);
      igual(diaSemana('2026-10-15'), 4);
      igual(diaSemana('2026-10-18'), 7);
    });
    prueba('Los jueves con Santander: 40% en Burger King', () => {
      const jueves = beneficiosDelDia(['santander'], '2026-10-15');
      if (!jueves.some(b => b.comercio === 'Burger King' && b.descuento === '40%')) throw new Error('no apareció Burger King');
      if (beneficiosDelDia(['santander'], '2026-10-14').some(b => b.comercio === 'Burger King')) throw new Error('apareció un miércoles');
    });
    prueba('Solo muestra las tarjetas elegidas, y primero los descuentos del día', () => {
      const lista = beneficiosDelDia(['bci'], '2026-10-12');
      igual([...new Set(lista.map(b => b.tarjeta))], ['bci']);
      const primeroDeTodos = lista.findIndex(b => !b.dias.length);
      if (primeroDeTodos >= 0 && lista.slice(primeroDeTodos).some(b => b.dias.length)) throw new Error('mezcló el orden');
      igual(beneficiosDelDia([], '2026-10-12'), []);
    });
    prueba('Dentro de cada grupo, los descuentos más altos primero', () => {
      const pct = b => Number(/(\d+)%/.exec(b.descuento)?.[1] ?? 0);
      const delDia = beneficiosDelDia(['santander', 'cmr', 'banco-de-chile'], '2026-10-13').filter(b => b.dias.length);
      for (let i = 1; i < delDia.length; i++) {
        if (pct(delDia[i]) > pct(delDia[i - 1])) throw new Error(`${delDia[i].comercio} quedó después de ${delDia[i - 1].comercio}`);
      }
    });
    prueba('No muestra descuentos vencidos', () => {
      const vencido = { tarjeta: 'santander', comercio: 'Prueba', rubro: 'cafe', descuento: '10%', dias: [4], hasta: '2026-10-31', fuente: 'https://x.cl' };
      BENEFICIOS.push(vencido);
      try {
        if (!beneficiosDelDia(['santander'], '2026-10-29').includes(vencido)) throw new Error('no apareció el último jueves vigente');
        if (beneficiosDelDia(['santander'], '2026-11-05').includes(vencido)) throw new Error('siguió apareciendo en noviembre');
      } finally {
        BENEFICIOS.pop();
      }
    });
    prueba('Días en palabras', () => {
      igual(textoDias([4]), 'jueves');
      igual(textoDias([1, 5]), 'lunes y viernes');
      igual(textoDias([1, 6, 7]), 'lunes, sábado y domingo');
      igual(textoDias([]), 'todos los días');
    });
    prueba('Cada descuento del catálogo está bien escrito', () => {
      const tarjetas = new Set(TARJETAS.map(t => t.id));
      for (const b of BENEFICIOS) {
        const quien = `${b.comercio} (${b.tarjeta}):`;
        if (!tarjetas.has(b.tarjeta)) throw new Error(`${quien} tarjeta desconocida`);
        if (!RUBROS[b.rubro]) throw new Error(`${quien} rubro desconocido`);
        if (!b.dias.every(d => Number.isInteger(d) && d >= 1 && d <= 7)) throw new Error(`${quien} día inválido`);
        if (!/^https:\/\//.test(b.fuente)) throw new Error(`${quien} la fuente no es https`);
        if (b.hasta !== null && !/^\d{4}-\d{2}-\d{2}$/.test(b.hasta)) throw new Error(`${quien} fecha "hasta" inválida`);
        if (!b.descuento) throw new Error(`${quien} sin descuento`);
      }
    });

    const fallas = resultados.filter(([, e]) => e);
    document.getElementById('resumen').innerHTML = fallas.length
      ? `<span class="falla">${fallas.length} de ${resultados.length} pruebas fallaron</span>`
      : `<span class="ok">Las ${resultados.length} pruebas pasaron</span>`;
    document.getElementById('resultados').innerHTML = resultados
      .map(([n, e]) => `<li class="${e ? 'falla' : 'ok'}">${e ? '✕' : '✓'} ${n}${e ? ' — ' + e : ''}</li>`).join('');
  </script>
</body>
